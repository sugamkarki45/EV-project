services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: evcharger
      POSTGRES_USER: evuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on: [db, redis]
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on: [db, redis]

  beat:
    build: ./backend
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on: [db, redis]

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file: .env

  admin:
    build: ./admin
    command: npm run dev -- --host
    volumes:
      - ./admin:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    env_file: .env

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on: [backend, frontend, admin]

  valhalla:
    build: ./valhalla
    ports:
      - "8002:8002"
    volumes:
      - valhalla_data:/data
    environment:
      - use_tiles_ignore_pbf=True

  nominatim:
    build: ./nominatim
    ports:
      - "8080:8080"
    volumes:
      - nominatim_data:/var/lib/postgresql/12/main
    environment:
      PBF_URL: https://download.geofabrik.de/asia/nepal-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/nepal-updates/

  martin:
    image: ghcr.io/maplibre/martin:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://evuser:${DB_PASSWORD}@db:5432/evcharger
    depends_on:
      - db

volumes:
  postgres_data:
  valhalla_data:
  nominatim_data:
